[platformio]
default_envs = leonardo
src_dir = Apex/src
include_dir = Apex/include

[env:leonardo]
platform = atmelavr@5.3.0
board = leonardo
framework = arduino
build_flags = -mcall-prologues -Wl,--relax -fno-split-wide-types -fno-move-loop-invariants -fno-tree-scev-cprop -fno-jump-tables -fno-inline-small-functions
